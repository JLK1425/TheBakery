<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Pedidos - The Bakery by Fresarte</title>
  <link rel="stylesheet" href="../TheBakery/assets/css/style.css">
  <style>
    .admin-page {
      min-height: 100vh;
      padding-top: 100px;
      background: #f9fafb;
    }
    .admin-header {
      background: #fff;
      border-bottom: 2px solid #e5e7eb;
      padding: 2rem 0;
      margin-bottom: 2rem;
    }
    .admin-header .container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .admin-title {
      font-size: 2rem;
      font-weight: 800;
      color: var(--fg);
      margin: 0;
    }
    .admin-subtitle {
      color: var(--muted);
      margin: 0.5rem 0 0;
    }
    .refresh-btn {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .refresh-btn:hover {
      background: var(--accent-600);
    }
    .orders-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 24px;
    }
    .orders-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .stat-card {
      background: #fff;
      border-radius: var(--radius);
      padding: 1.5rem;
      box-shadow: 0 2px 8px rgba(0,0,0,.1);
      border-left: 4px solid var(--accent);
    }
    .stat-card.pending { border-left-color: #f59e0b; }
    .stat-card.preparing { border-left-color: #3b82f6; }
    .stat-card.ready { border-left-color: #10b981; }
    .stat-card.delivery { border-left-color: #8b5cf6; }
    .stat-card.delivered { border-left-color: #6b7280; }
    .stat-label {
      font-size: 0.875rem;
      color: var(--muted);
      margin-bottom: 0.5rem;
      font-weight: 600;
    }
    .stat-value {
      font-size: 2rem;
      font-weight: 800;
      color: var(--fg);
    }
    .orders-list {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    .order-card {
      background: #fff;
      border-radius: var(--radius);
      padding: 1.5rem;
      box-shadow: 0 2px 8px rgba(0,0,0,.1);
      transition: box-shadow 0.2s;
    }
    .order-card:hover {
      box-shadow: 0 4px 16px rgba(0,0,0,.15);
    }
    .order-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 1rem;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .order-id {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--fg);
    }
    .order-date {
      color: var(--muted);
      font-size: 0.9rem;
    }
    .order-customer {
      margin-bottom: 1rem;
    }
    .customer-info {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }
    .customer-name {
      font-weight: 600;
      color: var(--fg);
    }
    .customer-email {
      color: var(--muted);
      font-size: 0.9rem;
    }
    .order-items {
      margin-bottom: 1rem;
      padding: 1rem;
      background: #f9fafb;
      border-radius: 8px;
    }
    .order-item {
      display: flex;
      justify-content: space-between;
      padding: 0.5rem 0;
      border-bottom: 1px solid #e5e7eb;
    }
    .order-item:last-child {
      border-bottom: none;
    }
    .item-name {
      font-weight: 600;
      color: var(--fg);
    }
    .item-details {
      font-size: 0.875rem;
      color: var(--muted);
      margin-top: 0.25rem;
    }
    .item-price {
      font-weight: 600;
      color: var(--accent);
    }
    .order-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 1rem;
      border-top: 2px solid #e5e7eb;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .order-total {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--fg);
    }
    .order-status {
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .status-label {
      font-weight: 600;
      color: var(--fg);
    }
    .status-select {
      padding: 0.5rem 1rem;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: border-color 0.2s;
      background: #fff;
    }
    .status-select:focus {
      outline: none;
      border-color: var(--accent);
    }
    .status-select.pending { color: #f59e0b; }
    .status-select.preparing { color: #3b82f6; }
    .status-select.ready { color: #10b981; }
    .status-select.delivery { color: #8b5cf6; }
    .status-select.delivered { color: #6b7280; }
    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      background: #fff;
      border-radius: var(--radius);
      box-shadow: 0 2px 8px rgba(0,0,0,.1);
    }
    .empty-state-icon {
      font-size: 4rem;
      margin-bottom: 1rem;
    }
    .empty-state h3 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
      color: var(--fg);
    }
    .empty-state p {
      color: var(--muted);
    }
    .loading {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--muted);
    }
    @media (max-width: 768px) {
      .admin-header .container {
        flex-direction: column;
        align-items: flex-start;
      }
      .order-header {
        flex-direction: column;
      }
      .order-footer {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>

<body id="bakery-landing" class="is-white">
  <!-- NAV -->
  <nav class="nav" id="nav">
    <div class="container wrap">
      <div class="brand">
        <a href="../index-original.html" style="display:inline-block">
          <img src="../TheBakery/assets/imagenes/logo.png" alt="The Bakery by Fresarte" style="height:36px">
        </a>
      </div>
      <div class="nav-center">
        <div class="links" id="navLinks">
          <a href="../index-original.html#home" class="nav-link">Inicio</a>
          <a href="../pasteles-de-autor.html" class="nav-link">Pasteles de Autor</a>
        </div>
      </div>
      <div class="nav-actions">
        <a href="../index-original.html" class="nav-action-btn">
          <svg class="icon-action" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
          <span>Volver al Sitio</span>
        </a>
      </div>
    </div>
  </nav>

  <!-- Admin Page -->
  <main class="admin-page">
    <div class="admin-header">
      <div class="container">
        <div>
          <h1 class="admin-title">Gestión de Pedidos</h1>
          <p class="admin-subtitle">Panel de control para colaboradores</p>
        </div>
        <button class="refresh-btn" id="refreshBtn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="23 4 23 10 17 10"></polyline>
            <polyline points="1 20 1 14 7 14"></polyline>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
          </svg>
          Actualizar
        </button>
      </div>
    </div>

    <div class="orders-container">
      <!-- Stats -->
      <div class="orders-stats" id="ordersStats">
        <!-- Stats will be generated by JS -->
      </div>

      <!-- Orders List -->
      <div class="orders-list" id="ordersList">
        <div class="loading">Cargando pedidos...</div>
      </div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="container">
      <div class="brand">The Bakery <span class="pink">by Fresarte</span></div>
      <div class="muted" style="margin-top:10px">© 2025 The Bakery by Fresarte. Todos los derechos reservados.</div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="../TheBakery/assets/js/admin-pedidos.js"></script>
</body>

</html>
