<!DOCTYPE html>
<html lang="es">

<head>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/favicon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Usuarios - The Bakery by Fresarte</title>
  <script src="../TheBakery/assets/js/auth-guard.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../TheBakery/assets/css/style.css">
  <link rel="stylesheet" href="../TheBakery/assets/css/admin-sidebar.css">
  <style>
    .admin-page {
      min-height: 100vh;
      padding-top: 140px;
      background: #f9fafb;
      width: 100%;
      margin: 0;
      box-sizing: border-box;
    }

    .admin-top-header {
      position: fixed;
      top: 0;
      left: 230px;
      right: 0;
      height: 60px;
      background: #fff;
      box-shadow: 0 2px 4px rgba(0, 0, 0, .05);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      transition: left 0.3s ease;
    }

    .admin-top-header-logo img {
      width: 150px;
      height: auto;
    }

    .admin-header-actions {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .admin-header-btn {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      background: transparent;
      border: none;
      color: #6b7280;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      border-radius: 6px;
    }

    .admin-header-btn:hover {
      background: #f9fafb;
      color: #374151;
    }

    .admin-header-btn-danger {
      color: #d7263d;
    }

    .admin-header-btn-danger:hover {
      background: #d91a6b;
      color: #fff;
    }

    .users-container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 0 24px 2rem;
    }

    .users-section-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .users-section-header h1 {
      font-size: 2rem;
      font-weight: 800;
      color: var(--fg);
      margin: 0;
    }

    .users-section-header p {
      color: var(--muted);
      margin: 0.25rem 0 0 0;
      font-size: 1rem;
    }

    .users-note {
      font-size: 0.813rem;
      color: var(--muted);
      margin-top: 0.5rem;
    }

    .btn-primary {
      background: #8b5cf6;
      color: #fff;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-primary:hover {
      background: #7c3aed;
    }

    .users-table-wrap {
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .08);
    }

    .users-table {
      width: 100%;
      border-collapse: collapse;
    }

    .users-table th,
    .users-table td {
      padding: 1rem;
      border-bottom: 1px solid #e5e7eb;
      text-align: left;
    }

    .users-table th {
      background: #f3f4f6;
      font-weight: 700;
      color: #374151;
    }

    .users-table tr:hover {
      background: #f9fafb;
    }

    .role-badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .role-badge.role-superadmin {
      background: #ede9fe;
      color: #6d28d9;
    }

    .role-badge.role-admin {
      background: #fce7f3;
      color: #be185d;
    }

    .btn-action {
      padding: 0.4rem 0.75rem;
      border-radius: 6px;
      border: none;
      font-size: 0.813rem;
      font-weight: 500;
      cursor: pointer;
      margin-right: 0.5rem;
      transition: background 0.2s;
    }

    .btn-action.btn-edit {
      background: #e0e7ff;
      color: #4338ca;
    }

    .btn-action.btn-edit:hover {
      background: #c7d2fe;
    }

    .btn-action.btn-delete {
      background: #fee2e2;
      color: #b91c1c;
    }

    .btn-action.btn-delete:hover {
      background: #fecaca;
    }

    .btn-action.btn-delete:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .user-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(2px);
      justify-content: center;
      align-items: center;
      z-index: 5000;
    }

    .user-modal.show {
      display: flex;
    }

    .user-modal-content {
      background: white;
      padding: 2rem;
      border-radius: 16px;
      width: 90%;
      max-width: 450px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
    }

    .user-modal-content h2 {
      margin: 0 0 1.5rem 0;
      font-size: 1.25rem;
      color: #374151;
    }

    .user-modal-content input,
    .user-modal-content select {
      width: 100%;
      padding: 0.75rem 1rem;
      margin-bottom: 1rem;
      border-radius: 8px;
      border: 2px solid #e5e7eb;
      font-size: 0.875rem;
      box-sizing: border-box;
    }

    .user-modal-content input:focus,
    .user-modal-content select:focus {
      outline: none;
      border-color: #8b5cf6;
    }

    .user-modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.75rem;
      margin-top: 1.5rem;
    }

    .user-modal-actions .btn-primary {
      margin: 0;
    }

    .user-modal-actions button:last-child {
      background: #e5e7eb;
      color: #374151;
      border: none;
      padding: 0.75rem 1.25rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }

    .user-modal-actions button:last-child:hover {
      background: #d1d5db;
    }

    @media (max-width: 768px) {

      .admin-sidebar.collapsed~.admin-top-header,
      .admin-top-header {
        left: 0;
      }

      .admin-page {
        padding-top: 100px;
      }

      .users-container {
        padding: 0 1rem 2rem;
      }
    }
  </style>
</head>

<body id="bakery-landing" class="is-white">

      </a>
      <a href="stock-pasteles.html" class="sidebar-nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path
            d="M20 7h-4M4 7h4m0 0v13a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2V7m0 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v3M10 7V4a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v3m8 0h4">
          </path>
        </svg>
        <span>Stock de Pasteles</span>
      </a>
      <a href="reportes.html" class="sidebar-nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

      <a href="usuarios.html" class="sidebar-nav-item active">

          <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>

    </nav>
    <div class="sidebar-footer">
      <a href="#" class="sidebar-footer-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"></circle>
          <path
            d="M12 1v6m0 6v6M5.64 5.64l4.24 4.24m4.24 4.24l4.24 4.24M1 12h6m6 0h6M5.64 18.36l4.24-4.24m4.24-4.24l4.24-4.24">
          </path>
        </svg>
        <span>Configuración</span>
      </a>
    </div>
  </aside>

  <header class="admin-top-header">
    <div class="admin-top-header-logo">
      <img src="../TheBakery/assets/imagenes/logo.png" alt="The Bakery">
    </div>
    <div class="admin-header-actions">
      <button class="admin-header-btn" id="refreshBtn">Actualizar</button>
      <button class="admin-header-btn admin-header-btn-danger" id="logoutBtn">Cerrar Sesión</button>
    </div>
  </header>

  <div class="admin-content-wrapper">
    <main class="admin-page">
      <div id="mainContent" class="users-container">
        <div class="users-section-header">
          <div>
            <h1>Gestión de Usuarios</h1>
            <p>Administra quién tiene acceso al panel</p>
            <p class="users-note">Solo visible para SuperAdmin</p>
          </div>
          <button type="button" class="btn-primary" id="createUserBtn">➕ Nuevo Usuario</button>
        </div>

        <div class="users-table-wrap">
          <table class="users-table">
            <thead>
              <tr>
                <th>Nombre</th>
                <th>Email</th>
                <th>Rol</th>
                <th>Creado</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="usersTableBody">
              <tr>
                <td colspan="5" style="text-align:center;padding:2rem;">Cargando...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Modal crear/editar usuario -->
  <div class="user-modal" id="userModal">
    <div class="user-modal-content">
      <h2 id="userModalTitle">Nuevo Usuario</h2>
      <form id="userForm" onsubmit="event.preventDefault(); window.saveUser();">
        <input type="text" id="userName" placeholder="Nombre completo" autocomplete="name">
        <input type="email" id="userEmail" placeholder="Email" required autocomplete="email">
        <input type="password" id="userPassword" placeholder="Mínimo 6 caracteres" autocomplete="new-password">
        <select id="userRole">
          <option value="admin">Admin</option>
          <option value="superadmin">SuperAdmin</option>
        </select>
        <div class="user-modal-actions">
          <button type="submit" class="btn-primary">Guardar</button>
          <button type="button" onclick="window.closeUserModal()">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../TheBakery/assets/js/admin-sidebar.js"></script>
  <script src="../TheBakery/assets/js/admin-usuarios.js"></script>
</body>

</html>
