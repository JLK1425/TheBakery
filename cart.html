<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrito - The Bakery</title>
  <link rel="stylesheet" href="TheBakery/assets/css/style.css">
  <style>
    .cart-page {
      min-height: 100vh;
      padding: 120px 20px 40px;
      background: #f9fafb;
    }
    .cart-container {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 30px;
    }
    .cart-section {
      background: white;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .cart-item {
      display: flex;
      gap: 20px;
      padding: 20px;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      margin-bottom: 15px;
    }
    .cart-item img {
      width: 100px;
      height: 100px;
      object-fit: cover;
      border-radius: 8px;
    }
    .cart-item-details {
      flex: 1;
    }
    .cart-item-name {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 5px;
    }
    .cart-item-price {
      color: #ec4899;
      font-size: 1.2rem;
      font-weight: 700;
    }
    .quantity-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
    }
    .quantity-btn {
      width: 32px;
      height: 32px;
      border: 1px solid #ddd;
      background: white;
      border-radius: 4px;
      cursor: pointer;
      font-size: 18px;
    }
    .quantity-btn:hover {
      background: #f3f4f6;
    }
    .remove-btn {
      background: #fee2e2;
      color: #dc2626;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      margin-left: auto;
    }
    .summary-row {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid #e5e7eb;
    }
    .summary-total {
      font-size: 1.5rem;
      font-weight: 800;
      color: #1f2937;
      margin-top: 15px;
    }
    .checkout-btn {
      width: 100%;
      background: #ec4899;
      color: white;
      border: none;
      padding: 16px;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 20px;
    }
    .checkout-btn:hover {
      background: #db2777;
    }
    .checkout-btn:disabled {
      background: #d1d5db;
      cursor: not-allowed;
    }
    .empty-cart {
      text-align: center;
      padding: 60px 20px;
    }
  </style>
</head>
<body>
  <!-- NAV -->
  <nav class="nav" id="nav">
    <div class="container wrap">
      <div class="brand">
        <a href="index-original.html">
          <img src="TheBakery/assets/imagenes/logo.png" alt="The Bakery" style="height:36px">
        </a>
      </div>
      <div class="nav-center">
        <div class="links">
          <a href="index-original.html#home">Inicio</a>
          <a href="pasteles-de-autor.html">Pasteles de Autor</a>
          <a href="index-original.html#reviews">Reseñas</a>
          <a href="index-original.html#about">Nosotros</a>
          <a href="index-original.html#contact">Contacto</a>
        </div>
      </div>
      <div class="nav-actions">
        <button class="nav-action-btn" onclick="window.location.href='cart.html'">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="9" cy="21" r="1"></circle>
            <circle cx="20" cy="21" r="1"></circle>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
          </svg>
          <span>Cart</span>
          <span class="cart-badge" id="cartBadge">0</span>
        </button>
      </div>
    </div>
  </nav>

  <!-- CART PAGE -->
  <main class="cart-page">
    <div class="cart-container">
      <!-- Items del carrito -->
      <div class="cart-section">
        <h1 style="margin-top:0">Tu Carrito</h1>
        <div id="cartItems">
          <!-- Se llenará con JavaScript -->
        </div>
      </div>

      <!-- Resumen -->
      <div class="cart-section">
        <h2 style="margin-top:0">Resumen del Pedido</h2>

        <div class="summary-row">
          <span>Subtotal</span>
          <span id="subtotal">RD$0.00</span>
        </div>

        <div class="summary-row">
          <span>Impuestos (18%)</span>
          <span id="taxes">RD$0.00</span>
        </div>

        <div class="summary-row summary-total">
          <span>Total</span>
          <span id="total">RD$0.00</span>
        </div>

        <button id="checkoutBtn" class="checkout-btn" type="button">
          Continuar a pago
        </button>
      </div>
    </div>
  </main>

  <script src="TheBakery/assets/js/cart.js"></script>
</body>
</html>
