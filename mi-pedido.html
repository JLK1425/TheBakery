<!DOCTYPE html>
<html lang="es">

<head>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/favicon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Pedido - The Bakery by Fresarte</title>
  <link rel="stylesheet" href="TheBakery/assets/css/style.css">
  <style>
    .tracking-page {
      min-height: 100vh;
      padding-top: 100px;
      background: linear-gradient(135deg, #f9fafb 0%, #fff 100%);
    }

    .tracking-container {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 24px 4rem;
    }

    .tracking-header {
      text-align: center;
      margin-bottom: 3rem;
    }

    .tracking-title {
      font-size: clamp(2rem, 4vw, 3rem);
      font-weight: 800;
      color: var(--fg);
      margin-bottom: 0.5rem;
    }

    .tracking-subtitle {
      color: var(--muted);
      font-size: 1.1rem;
    }

    .order-card {
      background: #fff;
      border-radius: var(--radius);
      padding: 2rem;
      box-shadow: 0 10px 40px rgba(0, 0, 0, .1);
      margin-bottom: 2rem;
    }

    .order-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 2rem;
      padding-bottom: 1.5rem;
      border-bottom: 2px solid #e5e7eb;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .order-id {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--fg);
    }

    .order-date {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .status-section {
      margin-bottom: 2rem;
    }

    .status-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--fg);
      margin-bottom: 1.5rem;
    }

    .status-content {
      padding-left: 1rem;
    }

    .status-label {
      font-weight: 700;
      color: var(--fg);
      margin-bottom: 0.25rem;
      font-size: 1.1rem;
    }

    .status-description {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .status-time {
      color: var(--muted);
      font-size: 0.85rem;
      margin-top: 0.5rem;
    }

    .order-details {
      margin-bottom: 2rem;
    }

    .details-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--fg);
      margin-bottom: 1rem;
    }

    .customer-info {
      background: #f9fafb;
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      padding: 0.75rem 0;
      border-bottom: 1px solid #e5e7eb;
    }

    .info-row:last-child {
      border-bottom: none;
    }

    .info-label {
      font-weight: 600;
      color: var(--muted);
    }

    .info-value {
      color: var(--fg);
      font-weight: 600;
    }

    .order-items {
      margin-bottom: 1.5rem;
    }

    .order-item {
      display: flex;
      gap: 1rem;
      padding: 1rem;
      background: #f9fafb;
      border-radius: 12px;
      margin-bottom: 1rem;
    }

    .order-item:last-child {
      margin-bottom: 0;
    }

    .item-image {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 8px;
      flex-shrink: 0;
    }

    .item-details {
      flex: 1;
    }

    .item-name {
      font-weight: 700;
      color: var(--fg);
      margin-bottom: 0.5rem;
    }

    .item-options {
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 0.5rem;
    }

    .item-quantity {
      font-size: 0.9rem;
      color: var(--muted);
    }

    .item-price {
      font-weight: 700;
      color: var(--accent);
      font-size: 1.1rem;
      min-width: 100px;
      text-align: right;
    }

    .order-total {
      background: var(--accent);
      color: #fff;
      border-radius: 12px;
      padding: 1.5rem;
      text-align: center;
    }

    .total-label {
      font-size: 0.9rem;
      opacity: 0.9;
      margin-bottom: 0.5rem;
    }

    .total-value {
      font-size: 2rem;
      font-weight: 800;
    }

    .action-buttons {
      display: flex;
      gap: 1rem;
      margin-top: 2rem;
      flex-wrap: wrap;
    }

    .btn {
      flex: 1;
      min-width: 150px;
    }

    .loading {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--muted);
    }

    .error-state {
      text-align: center;
      padding: 4rem 2rem;
      background: #fff;
      border-radius: var(--radius);
      box-shadow: 0 2px 8px rgba(0, 0, 0, .1);
    }

    .error-icon {
      font-size: 4rem;
      margin-bottom: 1rem;
    }

    .error-title {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
      color: var(--fg);
    }

    .error-message {
      color: var(--muted);
      margin-bottom: 1.5rem;
    }

    /* ── Review Modal ── */
    .tr-modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.55);
      z-index: 2000;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .tr-modal-overlay.active { display: flex; }
    .tr-modal-box {
      background: #fff;
      border-radius: 16px;
      padding: 2rem;
      width: 100%;
      max-width: 520px;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
      box-shadow: 0 20px 60px rgba(0,0,0,.25);
    }
    .tr-modal-close {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: none;
      border: none;
      font-size: 1.6rem;
      cursor: pointer;
      color: #9ca3af;
      line-height: 1;
      padding: 0;
    }
    .tr-field { margin-bottom: 1.1rem; }
    .tr-label { display: block; font-weight: 600; color: var(--fg); margin-bottom: 0.4rem; font-size: 0.95rem; }
    .tr-input, .tr-textarea {
      width: 100%;
      padding: 0.65rem 0.85rem;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      font-size: 1rem;
      font-family: inherit;
      box-sizing: border-box;
      transition: border-color 0.2s;
    }
    .tr-input:focus, .tr-textarea:focus { outline: none; border-color: var(--accent); }
    .tr-textarea { resize: vertical; }
    /* Star rating — reverse-order radio trick */
    .tr-stars { display: flex; flex-direction: row-reverse; justify-content: flex-end; gap: 0.2rem; }
    .tr-stars input[type="radio"] { display: none; }
    .tr-stars label { font-size: 2.2rem; color: #d1d5db; cursor: pointer; transition: color 0.1s; line-height: 1; }
    .tr-stars input:checked ~ label,
    .tr-stars label:hover,
    .tr-stars label:hover ~ label { color: #f59e0b; }

    @media print {
      .nav, .footer, .tracking-header, .action-buttons { display: none !important; }
      .tracking-page { padding-top: 10px !important; background: #fff !important; }
      .order-card { box-shadow: none !important; border: 1px solid #e5e7eb; }
    }

    @media (max-width: 768px) {
      .order-header {
        flex-direction: column;
      }

      .order-item {
        flex-direction: column;
      }

      .item-price {
        text-align: left;
        margin-top: 0.5rem;
      }
    }

    /* ==== TIMELINE FIX ==== */

    /* Línea vertical */
    .status-timeline {
      position: relative;
      margin-left: 25px;
      padding-left: 15px;
    }

    .status-step {
      position: relative;
      padding: 10px 0 20px 35px;
    }

    /* Punto circular */
    .status-indicator {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid #d1d5db;
      /* gris */
      background: #ffffff;
      position: absolute;
      left: -25px;
      top: 12px;
      z-index: 2;
    }

    /* Línea vertical base */
    .status-step::before {
      content: "";
      position: absolute;
      left: -19px;
      top: 0;
      width: 2px;
      height: 100%;
      background: #d1d5db;
      /* gris claro */
      z-index: 1;
    }

    /* Estado activo (actual) */
    .status-step.active .status-indicator {
      border-color: #ff3ea5;
      background: #ff3ea5;
    }

    .status-step.active::before {
      background: #ff3ea5;
    }

    /* Estados completados */
    .status-step.completed .status-indicator {
      border-color: #16a34a;
      background: #16a34a;
    }

    .status-step.completed::before {
      background: #16a34a;
    }

    /* Pendientes */
    .status-step.pending .status-indicator {
      background: white;
      border-color: #d1d5db;
    }

    .status-step.pending::before {
      background: #d1d5db;
    }
  </style>
</head>

  <!-- Scripts -->
  <!-- Review Modal -->
  <div class="tr-modal-overlay" id="trReviewOverlay">
    <div class="tr-modal-box">
      <button class="tr-modal-close" id="trReviewClose" aria-label="Cerrar">×</button>
      <h2 style="margin:0 0 1.5rem;font-size:1.4rem;font-weight:800;">⭐ Dejar una Reseña</h2>
      <form id="trReviewForm">
        <div class="tr-field">
          <label class="tr-label">Calificación</label>
          <div class="tr-stars">
            <input type="radio" name="tr-rating" value="5" id="trStar5">
            <label for="trStar5">★</label>
            <input type="radio" name="tr-rating" value="4" id="trStar4">
            <label for="trStar4">★</label>
            <input type="radio" name="tr-rating" value="3" id="trStar3">
            <label for="trStar3">★</label>
            <input type="radio" name="tr-rating" value="2" id="trStar2">
            <label for="trStar2">★</label>
            <input type="radio" name="tr-rating" value="1" id="trStar1">
            <label for="trStar1">★</label>
          </div>
        </div>
        <div class="tr-field">
          <label class="tr-label" for="trReviewerName">Tu Nombre</label>
          <input class="tr-input" type="text" id="trReviewerName" required autocomplete="name">
        </div>
        <div class="tr-field">
          <label class="tr-label" for="trReviewTitle">Título</label>
          <input class="tr-input" type="text" id="trReviewTitle" required placeholder="Ej: ¡Increíble pastel!">
        </div>
        <div class="tr-field">
          <label class="tr-label" for="trReviewComment">Comentario</label>
          <textarea class="tr-textarea" id="trReviewComment" rows="4" required placeholder="Cuéntanos tu experiencia..."></textarea>
        </div>
        <div class="tr-field" style="margin-bottom:1.5rem;">
          <label class="tr-label" for="trReviewPhoto">Foto (opcional) <span style="font-weight:400;color:var(--muted);font-size:0.82rem;">— máx. 5MB</span></label>
          <input type="file" id="trReviewPhoto" accept="image/*" style="font-size:0.9rem;">
          <div id="trPhotoPreview" style="display:none;margin-top:0.75rem;position:relative;width:fit-content;">
            <img id="trPreviewImg" src="" alt="Preview" style="max-height:110px;border-radius:8px;border:2px solid #e5e7eb;">
            <button type="button" id="trRemovePhoto" style="position:absolute;top:-8px;right:-8px;background:#ef4444;color:#fff;border:none;border-radius:50%;width:22px;height:22px;font-size:0.95rem;cursor:pointer;line-height:1;">×</button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary" id="trReviewSubmit" style="width:100%;">Publicar Reseña</button>
      </form>
    </div>
