<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pasteles de Autor - The Bakery by Fresarte</title>
  <link rel="stylesheet" href="TheBakery/assets/css/style.css">
  <link rel="stylesheet" href="TheBakery/assets/css/pasteles-autor.css">
</head>

<body id="bakery-landing" class="is-white">

  <!-- NAV -->
  <nav class="nav" id="nav">
    <div class="container wrap">
      <div class="brand">
        <a href="index-original.html">
          <img src="TheBakery/assets/imagenes/logo.png" alt="The Bakery by Fresarte" style="height:36px">
        </a>
      </div>
      <div class="nav-center">
        <div class="links" id="navLinks">
          <a href="index-original.html#home" class="nav-link">Inicio</a>
          <a href="pasteles-de-autor.html" class="nav-link">Pasteles de Autor</a>
          <a href="index-original.html#reviews" class="nav-link">Reseñas</a>
          <a href="index-original.html#about" class="nav-link">Nosotros</a>
          <a href="index-original.html#contact" class="nav-link">Contacto</a>
        </div>
      </div>
      <div class="nav-actions">
        <!-- Search -->
        <div class="search-container">
          <button class="search-btn" id="searchBtn" aria-label="Buscar">
            <svg class="icon-search" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"></circle>
              <path d="m21 21-4.35-4.35"></path>
            </svg>
            <span class="search-text">Search</span>
          </button>
          <div class="search-overlay" id="searchOverlay">
            <div class="search-box">
              <input type="text" id="searchInput" placeholder="Buscar productos..." autocomplete="off">
              <button class="search-close" id="searchClose" aria-label="Cerrar búsqueda">×</button>
            </div>
            <div class="search-results" id="searchResults"></div>
          </div>
        </div>
        <!-- Login -->
        <button class="nav-action-btn" id="loginBtn">
          <svg class="icon-action" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          <span>Mi cuenta</span>
        </button>
        <!-- Cart -->
        <button class="nav-action-btn" id="cartBtn">
          <svg class="icon-action" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="9" cy="21" r="1"></circle>
            <circle cx="20" cy="21" r="1"></circle>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
          </svg>
          <span>Cart</span>
          <span class="cart-badge" id="cartBadge">0</span>
        </button>
      </div>
    </div>
  </nav>

  <!-- PASTELES DE AUTOR PAGE -->
  <main class="pasteles-autor-page">
    <!-- Page Header -->
    <div class="page-header">
      <div class="container">
        <h1 class="page-title">PASTELES DE AUTOR</h1>
        <p class="page-description">Obras maestras únicas, diseñadas con pasión y creatividad artística</p>
      </div>
    </div>

    <!-- Featured Cakes Slider -->
    <div class="featured-slider-container">
      <div class="container">
        <div class="featured-slider" id="featuredSlider">
          <button class="slider-nav-btn slider-prev" id="sliderPrev" aria-label="Anterior">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
          </button>
          <div class="slider-track" id="sliderTrack">
            <!-- Slides will be generated by JS -->
          </div>
          <button class="slider-nav-btn slider-next" id="sliderNext" aria-label="Siguiente">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </button>
          <div class="slider-dots" id="sliderDots">
            <!-- Dots will be generated by JS -->
          </div>
        </div>
      </div>
    </div>

    <!-- Filters and Sort -->
    <div class="filters-section">
      <div class="container">
        <div class="filters-wrapper">
          <div class="sort-selector">
            <label for="sortSelect" class="sort-label">Ordenar por:</label>
            <select id="sortSelect" class="sort-select">
              <option value="featured">Destacados</option>
              <option value="bestseller">Más Vendidos</option>
              <option value="price-asc">Precio: de menor a mayor</option>
              <option value="price-desc">Precio: de mayor a menor</option>
              <option value="recent">Más Recientes</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <!-- Products Grid -->
    <div class="products-section">
      <div class="container">
        <div class="products-grid" id="productsGrid">
          <!-- Products will be loaded by JS -->
        </div>
        <div class="products-loading" id="productsLoading">
          <p>Cargando productos...</p>
        </div>
        <div class="products-empty" id="productsEmpty" style="display:none">
          <p>No se encontraron productos.</p>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <div class="brand">The Bakery <span class="pink">by Fresarte</span></div>
      <div class="muted" style="margin-top:10px">© 2025 The Bakery by Fresarte. Todos los derechos reservados.</div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="TheBakery/assets/js/script.js"></script>
  <script src="TheBakery/assets/js/pasteles-autor.js"></script>
</body>

</html>
